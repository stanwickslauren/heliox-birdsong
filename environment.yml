# Python environment for the heliox birdsong figure notebooks.
# These are the versions the figures in the paper were made with (Python 3.8).
#
#   conda env create -f environment.yml
#   conda activate heliox-birdsong
#
# The compiled packages come from conda-forge, so nothing has to be built from source.
# The rest are installed by pip, as on the machine the paper's analyses ran on.
name: heliox-birdsong
channels:
  - conda-forge
dependencies:
  - python=3.8
  - numpy=1.22.4
  - scipy=1.10.1
  - scikit-learn=0.24.1
  - hdbscan=0.8.33
  - notebook
  - nbconvert
  - pip
  - pip:
      - pandas==1.5.3
      - statsmodels==0.14.1
      - matplotlib==3.7.5
      - seaborn==0.11.1
      - networkx==3.1
      - umap-learn==0.5.5
